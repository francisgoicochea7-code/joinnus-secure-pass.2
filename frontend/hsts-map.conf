# HSTS solo para hosts públicos. En localhost/127.0.0.1 se omite a propósito:
# HSTS se aplica por host (no por puerto) y forzaría HTTPS también en el
# panel de ZAP (8082), el backend (3001) y otros servicios locales.
map $host $hsts_value {
    default          "max-age=31536000; includeSubDomains";
    localhost        "";
    127.0.0.1        "";
}
