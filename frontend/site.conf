# =========================================================================
#  JOINNUS SECURE PASS — frontend/nginx.conf
#  1) Sirve el sitio estatico del prototipo
#  2) Actua como proxy inverso: /api/* -> backend:3000/api/*
#     Asi el navegador siempre habla con el mismo origen y no hay problemas
#     de CORS durante la exposicion.
# =========================================================================

    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    # --- Pagina de inicio por defecto ---
    location / {
        try_files $uri $uri/ =404;

        # El prototipo no versiona los archivos: no se guardan en caché y el
        # navegador siempre recibe la última versión tras un rebuild.
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/security-headers.conf;
    }

    # --- Proxy hacia la API del contenedor backend ---
    location /api/ {
        # Evitar una segunda CSP del backend con reglas distintas.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # --- Codigo del prototipo (css/js): siempre revalidar ---
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?|ttf)$ {
        # nginx:alpine no trae font/ttf en mime.types.
        default_type font/ttf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # --- Compresion ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # --- Cabeceras de seguridad basicas ---
    include /etc/nginx/security-headers.conf;

    # --- Pagina de errorFriendly ---
    error_page 404 /index.html;
