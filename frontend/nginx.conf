# =========================================================================
#  JOINNUS SECURE PASS — frontend/nginx.conf
#  1) Sirve el sitio estatico del prototipo
#  2) Actua como proxy inverso: /api/* -> backend:3000/api/*
#     Asi el navegador siempre habla con el mismo origen y no hay problemas
#     de CORS durante la exposicion.
# =========================================================================

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    # --- Pagina de inicio por defecto ---
    location / {
        try_files $uri $uri/ =404;

        # El prototipo no versiona los archivos: sin cache, el navegador
        # siempre revalida y ve los ultimos cambios tras un
        # `docker compose up --build frontend`.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # --- Proxy hacia la API del contenedor backend ---
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # --- Codigo del prototipo (css/js): siempre revalidar ---
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --- Compresion ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # --- Cabeceras de seguridad basicas ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Pagina de errorFriendly ---
    error_page 404 /index.html;
}
