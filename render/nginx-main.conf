# =========================================================================
#  Configuración principal de Nginx para Render.
#
#  No hay TLS propio: Render termina el cifrado y reenvía HTTP al puerto que
#  publica la plataforma (variable PORT). El servidor concreto se genera en
#  /app/render/conf/default.conf al arrancar (ver render/start.sh) porque el
#  puerto sólo se conoce en tiempo de ejecución.
# =========================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Directorios temporales en /tmp: el contenedor corre como usuario "app".
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"request_id":"$request_id",'
      '"upstream":"$upstream_addr","rt":$request_time}';

    # En este host sí aplica HSTS: el sitio se publica con HTTPS de verdad.
    include /etc/nginx/hsts-map.conf;

    include /app/render/conf/*.conf;
}
