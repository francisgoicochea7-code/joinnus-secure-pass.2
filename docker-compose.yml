# =========================================================================
#  JOINNUS SECURE PASS — docker-compose.yml (versión 2)
#  Orquestación de los tres contenedores del proyecto:
#     postgres -> base de datos (PostgreSQL 16)
#     backend  -> API REST (Node.js + Express + pg)
#     frontend -> sitio estático (nginx) + proxy inverso hacia la API
#
#  Uso:  docker compose up --build
#  Web:  http://localhost:8081
#
#  NOTA: los nombres llevan el prefijo jsp2- y los puertos 8081/3001/5433
#  para poder convivir con la versión 1 (8080/3000/3307) sin chocar.
# =========================================================================

services:

  # ---------------------------------------------------------------------
  # 1) BASE DE DATOS — PostgreSQL 16
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: jsp2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-joinnus_secure_pass}
      POSTGRES_USER:     ${DB_USER:-joinnus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-joinnus_pass}
      TZ:                ${TZ:-America/Lima}
    ports:
      # SOLO en localhost: sirve para inspección manual con psql y, al
      # publicar el proyecto, impide alcanzar la base desde la red.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta SOLO la primera vez (volumen vacío)
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-joinnus} -d ${DB_NAME:-joinnus_secure_pass}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - jsp2_net

  # ---------------------------------------------------------------------
  # 2) BACKEND — API REST
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: joinnus-secure-pass-backend-v2
    container_name: jsp2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-joinnus_secure_pass}
      DB_USER: ${DB_USER:-joinnus}
      DB_PASSWORD: ${DB_PASSWORD:-joinnus_pass}
      # Secreto de firma de los tokens QR: OBLIGATORIO (no hay valor por
      # defecto). Se define en el archivo .env de la raíz del proyecto.
      QR_SECRET: "${QR_SECRET:?Falta QR_SECRET - copia .env.example a .env y define tu clave}"
      # Vigencia de cada token dinámico, en segundos
      QR_TTL_SECONDS: ${QR_TTL_SECONDS:-15}
      # Firma de las sesiones (login con contrasena). Opcional: si falta se
      # deriva de QR_SECRET. En produccion conviene un valor propio.
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      # DNI del usuario de la sesión demo ("Mis entradas")
      DEMO_DNI: ${DEMO_DNI:-45678945}
      TZ: ${TZ:-America/Lima}
    ports:
      # SOLO en localhost: nginx llega por la red interna del compose y fuera
      # de la máquina únicamente se publica el 80 del frontend.
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    volumes:
      # Fuente única de verdad para reiniciar la demo
      - ./database/init.sql:/app/seed.sql:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 40s
    networks:
      - jsp2_net

  # ---------------------------------------------------------------------
  # 3) FRONTEND — nginx (estático + proxy /api)
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: joinnus-secure-pass-frontend-v2
    container_name: jsp2-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Puerto que se abre en el navegador:  http://localhost:8081
      - "${FRONTEND_PORT:-8081}:80"
    environment:
      TZ: ${TZ:-America/Lima}
    networks:
      - jsp2_net

# -----------------------------------------------------------------------
#  Redes y volúmenes
# -----------------------------------------------------------------------
networks:
  jsp2_net:
    driver: bridge
    name: jsp2_net

volumes:
  postgres_data:
    name: jsp2_postgres_data
