# -----------------------------------------------------------------------
#  Analisis estatico con SonarQube (community)
#  Se ejecuta con: docker compose -f docker-compose.sonar.yml --profile scan run --rm scanner
# -----------------------------------------------------------------------

sonar.projectKey=joinnus-secure-pass
sonar.projectName=Joinnus Secure Pass
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8

# Codigo de la aplicacion (frontend + backend + scripts + funcion de Vercel)
sonar.sources=backend,frontend,api,scripts

# Pruebas propias (no se analizan como codigo de produccion)
sonar.tests=test
sonar.test.inclusions=test/**/*.js

# Fuera del analisis: dependencias, datos binarios y resultados del escaneo
sonar.exclusions=**/node_modules/**,**/*.min.js,**/vendor/**,**/*.png,**/*.jpg,**/*.svg,**/.scannerwork/**,database/**,docs/**

# Cobertura: la suite actual es un script propio sin instrumentar, asi que no
# se envia lcov. El quality gate de Sonar se evalua sobre codigo nuevo.
