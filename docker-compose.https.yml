# Uso: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Certificados locales obligatorios: ver docs/ZAP-MEJORAS.md.
services:
  frontend:
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./frontend/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.certs:/etc/nginx/certs:ro
    healthcheck:
      # Sólo comprueba vida dentro del contenedor; no valida confianza TLS.
      # localhost puede resolver a ::1 dentro del contenedor; 127.0.0.1 evita
      # falsos "connection refused" con Nginx escuchando en IPv4.
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 4s
      start_period: 5s
      retries: 3
