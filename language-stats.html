<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas de Lenguajes - joinnus-secure-pass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .language-item {
            margin-bottom: 30px;
        }
        
        .language-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .language-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        
        .language-percent {
            font-weight: 700;
            font-size: 18px;
            color: #667eea;
        }
        
        .bar-container {
            background: #e0e0e0;
            border-radius: 8px;
            height: 24px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        
        .javascript { background: linear-gradient(90deg, #f7df1e, #f4c300); }
        .html { background: linear-gradient(90deg, #e34c26, #ff6b3d); }
        .css { background: linear-gradient(90deg, #563d7c, #7d3fa8); }
        .dockerfile { background: linear-gradient(90deg, #2496ed, #0066cc); }
        
        .footer {
            background: #f5f5f5;
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
        }
        
        .stats-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .stat-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-box .number {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-box .label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 joinnus-secure-pass</h1>
            <p>Composición de Lenguajes de Programación</p>
        </div>
        
        <div class="content">
            <div class="stats-summary">
                <div class="stat-box">
                    <div class="number">4</div>
                    <div class="label">Lenguajes</div>
                </div>
                <div class="stat-box">
                    <div class="number">100%</div>
                    <div class="label">Cobertura Total</div>
                </div>
            </div>
            
            <div class="language-item">
                <div class="language-header">
                    <span class="language-name">JavaScript</span>
                    <span class="language-percent">65.6%</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill javascript" style="width: 65.6%;">65.6%</div>
                </div>
            </div>
            
            <div class="language-item">
                <div class="language-header">
                    <span class="language-name">HTML</span>
                    <span class="language-percent">23.1%</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill html" style="width: 23.1%;">23.1%</div>
                </div>
            </div>
            
            <div class="language-item">
                <div class="language-header">
                    <span class="language-name">CSS</span>
                    <span class="language-percent">10.8%</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill css" style="width: 10.8%;">10.8%</div>
                </div>
            </div>
            
            <div class="language-item">
                <div class="language-header">
                    <span class="language-name">Dockerfile</span>
                    <span class="language-percent">0.5%</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill dockerfile" style="width: 0.5%;">0.5%</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>📁 Repositorio: francisgoicochea7-code/joinnus-secure-pass</p>
        </div>
    </div>
</body>
</html>
