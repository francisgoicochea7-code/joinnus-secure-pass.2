# =========================================================================
#  Configuración principal del gateway sin privilegios.
#  El contenedor corre como usuario "nginx" y escucha en 8080/8443, por
#  encima de 1024. Docker publica esos puertos como 8082/8444.
# =========================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nginx necesita directorios temporales escribibles; /tmp lo es para
    # cualquier usuario dentro del contenedor.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
