# Configuración común de las locations /api/* del gateway.
# Nginx no hereda add_header si la location define los suyos, por eso este
# archivo se incluye en cada location de API.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout    30s;
proxy_send_timeout    30s;

# La respuesta de los servicios no debe duplicar cabeceras de seguridad.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Strict-Transport-Security;

add_header Access-Control-Allow-Origin  $cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type, X-Usuario-DNI, X-Request-Id, Authorization" always;
add_header Access-Control-Max-Age       "86400" always;
add_header Vary                         "Origin" always;
add_header Cache-Control                "no-store, max-age=0" always;

include /etc/nginx/security-headers.conf;

# Preflight CORS: no llega a los servicios.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin  $cors_origin;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, X-Usuario-DNI, X-Request-Id, Authorization";
    add_header Access-Control-Max-Age       "86400";
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}
