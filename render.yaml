# =========================================================================
#  Blueprint de Render — Joinnus Secure Pass (microservicios)
#
#  Un único servicio web (contenedor con auth + tickets + qr + gateway) y la
#  base de datos en Aiven. Render aporta el HTTPS público; Aiven guarda los
#  datos y no caduca como la base gratuita de Render.
#
#  Uso:
#    1. Subir la rama a GitHub.
#    2. En Render: New + -> Blueprint -> elegir el repositorio.
#    3. Pegar DATABASE_URL (la URI de Aiven) cuando Render la pida.
#
#  Guía paso a paso: docs/DESPLIEGUE-RENDER.md
# =========================================================================

services:
  - type: web
    name: joinnus-secure-pass
    runtime: docker
    plan: free
    region: oregon
    branch: feat/microservicios
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Lima
      # Conexión a Aiven: una URL con sslmode=require y el nombre de base que
      # cada servicio necesita (auth_db, tickets_db, qr_db) lo agrega el código.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      # Tres conexiones por servicio: la base gratuita de Aiven es pequeña.
      - key: DB_POOL_MAX
        value: "3"
      # Secreto de firma de los QR. Debe ser fijo entre despliegues para que
      # los códigos ya emitidos sigan siendo válidos (el Blueprint lo genera
      # una sola vez y lo conserva).
      - key: QR_SECRET
        generateValue: true
      # Token de comunicación interna entre servicios (se genera una vez).
      - key: INTERNAL_TOKEN
        generateValue: true
      # Firma de las sesiones de usuario. Si cambia, todos deben volver a
      # iniciar sesión; el Blueprint lo genera una vez y lo conserva.
      - key: SESSION_SECRET
        generateValue: true
      # En Resend verifica tu dominio de envío y agrega la API key en Render.
      # Sin las tres variables el envío queda pendiente, nunca se inventa una
      # contraseña ni se informa que llegó un correo no enviado.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_URL
        value: https://joinnus-secure-pass2.onrender.com
      - key: QR_TTL_SECONDS
        value: "15"
      - key: DEMO_DNI
        value: "45678945"
      # Primera vez: true. Después de la carga inicial se puede poner en false
      # para arrancar más rápido.
      - key: SEED_ON_START
        value: "true"

# -------------------------------------------------------------------------
#  Alternativa sin Aiven: descomentar para que Render cree su propia base
#  PostgreSQL gratuita (1 GB, se suspende a los 30 días) y enlazarla al
#  servicio. En ese caso, en el servicio de arriba:
#    - quitar el envVar DATABASE_URL
#    - poner DB_SSL en "false"
#    - añadir DATABASE_URL con fromDatabase como en el ejemplo
